name: Deploy Flatris Application

on:
  push:
    branches:
      - master
    paths:
      - ansible/**
      - docker-compose.yml
      - Dockerfile
      - server/**
      - web/**
      - shared/**
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install Yarn
        run: |
          corepack disable
          npm install -g yarn@1.22.19

      - name: Install dependencies
        run: |
          for i in {1..3}; do
            if yarn install --frozen-lockfile; then
              break
            fi
            echo "Attempt $i failed, retrying..."
            sleep 5
          done

      - name: Run tests
        run: yarn test

  deploy:
    runs-on: self-hosted
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        run: |
          mkdir -p ~/.aws
          echo "[default]" > ~/.aws/credentials
          echo "aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}" >> ~/.aws/credentials
          echo "aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> ~/.aws/credentials
          echo "[default]" > ~/.aws/config
          echo "region = ap-southeast-1" >> ~/.aws/config
          chmod 600 ~/.aws/credentials ~/.aws/config

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/flatris-keypair.pem
          chmod 400 ~/.ssh/flatris-keypair.pem

      - name: Setup Pulumi
        run: |
          if ! command -v pulumi &> /dev/null; then
            curl -fsSL https://get.pulumi.com | sh
            export PATH=$PATH:$HOME/.pulumi/bin
            echo "$HOME/.pulumi/bin" >> $GITHUB_PATH
          fi

      - name: Setup uv
        run: |
          if ! command -v uv &> /dev/null; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH=$PATH:$HOME/.cargo/bin
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi

      - name: Pulumi login
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          export PATH=$PATH:$HOME/.pulumi/bin
          pulumi login

      - name: Select Pulumi stack
        run: |
          cd infra
          export PATH=$PATH:$HOME/.pulumi/bin
          pulumi stack select flatris-dev

      - name: Get Pulumi outputs
        id: pulumi-outputs
        run: |
          cd infra
          export PATH=$PATH:$HOME/.pulumi/bin:$HOME/.cargo/bin
          uv sync
          # Get app IPs from Pulumi stack outputs
          APP_PRIVATE_IP=$(pulumi stack output flatris_app_private_ip)
          APP_PUBLIC_IP=$(pulumi stack output flatris_app_public_ip)

          echo "app_private_ip=$APP_PRIVATE_IP" >> $GITHUB_ENV
          echo "app_public_ip=$APP_PUBLIC_IP" >> $GITHUB_ENV
          echo "App Private IP: $APP_PRIVATE_IP"
          echo "App Public IP: $APP_PUBLIC_IP"

      - name: Wait for app instance to be ready
        run: |
          APP_PUBLIC_IP="${{ env.app_public_ip }}"
          echo "Waiting for app at $APP_PUBLIC_IP to be ready..."

          for i in {1..30}; do
            if ssh -i ~/.ssh/flatris-keypair.pem -o StrictHostKeyChecking=no -o ConnectTimeout=5 ubuntu@$APP_PUBLIC_IP "echo ready" 2>/dev/null; then
              echo "App instance is ready!"
              exit 0
            fi
            echo "Attempt $i: App not ready yet, waiting 10 seconds..."
            sleep 10
          done
          
          echo "App instance failed to become ready"
          exit 1

      - name: Install Ansible collections
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-pip git
          pip3 install ansible-core
          cd ansible
          ansible-galaxy collection install -r requirements.yml

      - name: Clone repository on runner
        run: |
          rm -rf /home/ubuntu/flatris
          git clone https://github.com/kaziiriad/flatris.git /home/ubuntu/flatris
          cd /home/ubuntu/flatris
          git log -1

      - name: Deploy to Flatris App using Ansible
        run: |
          cd ansible
          ansible-playbook -i hosts.ini deploy_flatris.yml -v

      - name: Health check
        run: |
          APP_PUBLIC_IP="${{ env.app_public_ip }}"
          ssh -i ~/.ssh/flatris-keypair.pem -o StrictHostKeyChecking=no ubuntu@$APP_PUBLIC_IP \
            "curl -f http://localhost:3000/favicon.ico"

      - name: Get deployment URL
        id: deployment-url
        run: |
          cd infra
          export PATH=$PATH:$HOME/.pulumi/bin:$HOME/.cargo/bin
          URL=$(pulumi stack output flatris_url)
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployment URL: $URL"

      - name: Display deployment info
        run: |
          echo "==================================="
          echo "Deployment Complete!"
          echo "==================================="
          echo "Flatris URL: ${{ steps.deployment-url.outputs.url }}"
          echo "App Public IP: ${{ env.app_public_ip }}"
          echo "==================================="