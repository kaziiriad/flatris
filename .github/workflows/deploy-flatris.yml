name: Deploy Flatris Application

on:
  push:
    branches:
      - master
    paths:
      - ansible/**
      - docker-compose.yml
      - Dockerfile
      - server/**
      - web/**
      - shared/**
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install Yarn
        run: |
          corepack disable
          npm install -g yarn@1.22.19

      - name: Install dependencies
        run: |
          for i in {1..3}; do
            if yarn install --frozen-lockfile; then
              break
            fi
            echo "Attempt $i failed, retrying..."
            sleep 5
          done

      - name: Run tests
        run: yarn test

  deploy:
    runs-on: self-hosted
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        run: |
          mkdir -p ~/.aws
          echo "[default]" > ~/.aws/credentials
          echo "aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}" >> ~/.aws/credentials
          echo "aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> ~/.aws/credentials
          echo "[default]" > ~/.aws/config
          echo "region = ap-southeast-1" >> ~/.aws/config
          chmod 600 ~/.aws/credentials ~/.aws/config

      - name: Setup SSH key
        run: |
          # Setup .ssh directory with correct permissions
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Remove any existing key with sudo if needed
          sudo rm -f ~/.ssh/flatris-keypair.pem 2>/dev/null || rm -f ~/.ssh/flatris-keypair.pem

          # Write key without echo
          cat > ~/.ssh/flatris-keypair.pem << 'KEY_EOF'
          ${{ secrets.SSH_PRIVATE_KEY }}
          KEY_EOF

          # Set correct permissions
          chmod 400 ~/.ssh/flatris-keypair.pem

          # Fix ownership if needed (for self-hosted runner)
          sudo chown $USER:$USER ~/.ssh/flatris-keypair.pem 2>/dev/null || true

          echo "SSH key setup complete"

      - name: Setup Pulumi
        run: |
          if ! command -v pulumi &> /dev/null; then
            curl -fsSL https://get.pulumi.com | sh
            export PATH=$PATH:$HOME/.pulumi/bin
            echo "$HOME/.pulumi/bin" >> $GITHUB_PATH
          fi

      - name: Setup uv
        run: |
          if ! command -v uv &> /dev/null; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH=$PATH:$HOME/.cargo/bin
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi

      - name: Pulumi login
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          export PATH=$PATH:$HOME/.pulumi/bin
          pulumi login

      - name: Select Pulumi stack
        run: |
          cd infra
          export PATH=$PATH:$HOME/.pulumi/bin
          pulumi stack select flatris-dev

      - name: Get Pulumi outputs
        id: pulumi-outputs
        run: |
          cd infra
          export PATH=$PATH:$HOME/.pulumi/bin:$HOME/.cargo/bin
          uv sync
          # Get IPs from Pulumi stack outputs
          APP_PRIVATE_IP=$(pulumi stack output flatris_app_private_ip)
          APP_PUBLIC_IP=$(pulumi stack output flatris_app_public_ip)
          RUNNER_PUBLIC_IP=$(pulumi stack output runner_public_ip)

          echo "app_private_ip=$APP_PRIVATE_IP" >> $GITHUB_ENV
          echo "app_public_ip=$APP_PUBLIC_IP" >> $GITHUB_ENV
          echo "runner_public_ip=$RUNNER_PUBLIC_IP" >> $GITHUB_ENV
          echo "App Private IP: $APP_PRIVATE_IP"
          echo "App Public IP: $APP_PUBLIC_IP"
          echo "Runner Public IP: $RUNNER_PUBLIC_IP"

      - name: Configure SSH proxy through bastion
        run: |
          # Create SSH config for bastion proxy
          cat >> ~/.ssh/config << 'EOF'
          Host flatris-bastion
            HostName ${{ env.runner_public_ip }}
            User ubuntu
            IdentityFile ~/.ssh/flatris-keypair.pem
            StrictHostKeyChecking no

          Host flatris-app
            HostName ${{ env.app_private_ip }}
            User ubuntu
            IdentityFile ~/.ssh/flatris-keypair.pem
            StrictHostKeyChecking no
            ProxyJump flatris-bastion
          EOF

      - name: Wait for app instance to be ready
        run: |
          echo "Waiting for app at ${{ env.app_private_ip }} to be ready (via bastion)..."

          for i in {1..30}; do
            if ssh flatris-app "echo ready" 2>/dev/null; then
              echo "App instance is ready!"
              exit 0
            fi
            echo "Attempt $i: App not ready yet, waiting 10 seconds..."
            sleep 10
          done

          echo "App instance failed to become ready"
          exit 1

      - name: Deploy to Flatris App
        run: |
          # Copy repo to remote server
          echo "Copying files to remote server..."
          ssh flatris-app "rm -rf /home/ubuntu/flatris-repo"
          ssh flatris-app "mkdir -p /home/ubuntu/flatris-repo"
          rsync -av --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.github' \
            --exclude='infra' \
            --exclude='ansible' \
            ${{ github.workspace }}/ flatris-app:/home/ubuntu/flatris-repo/

          # Deploy on remote server
          echo "Deploying Flatris..."
          ssh flatris-app bash << 'ENDSSH'
            set -e
            cd /home/ubuntu/flatris-repo

            # Stop existing containers
            echo "Stopping existing containers..."
            docker-compose -f docker-compose.yml --profile without-nginx down 2>/dev/null || true

            # Build and start
            echo "Building and starting Flatris..."
            docker-compose -f docker-compose.yml --profile without-nginx up -d --build

            # Wait for health
            echo "Waiting for Flatris to be healthy..."
            for i in {1..30}; do
              if curl -f http://localhost:3000/favicon.ico >/dev/null 2>&1; then
                echo "Flatris is healthy!"
                exit 0
              fi
              echo "Attempt $i: not ready yet..."
              sleep 5
            done
            echo "Flatris failed health check"
            exit 1
          ENDSSH

      - name: Health check
        run: |
          ssh flatris-app "curl -f http://localhost:3000/favicon.ico"

      - name: Get deployment URL
        id: deployment-url
        run: |
          cd infra
          export PATH=$PATH:$HOME/.pulumi/bin:$HOME/.cargo/bin
          URL=$(pulumi stack output flatris_url)
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployment URL: $URL"

      - name: Display deployment info
        run: |
          echo "==================================="
          echo "Deployment Complete!"
          echo "==================================="
          echo "Flatris URL: ${{ steps.deployment-url.outputs.url }}"
          echo "App Public IP: ${{ env.app_public_ip }}"
          echo "==================================="