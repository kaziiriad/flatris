name: Deploy Infrastructure to AWS

on:
  push:
    branches:
      - master
    paths:
      - infra/**
  workflow_dispatch:

jobs:
  deploy-infra:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Setup Pulumi
        run: |
          curl -fsSL https://get.pulumi.com | sh
          echo "$PATH" >> $GITHUB_PATH

      - name: Pulumi login
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: pulumi login

      - name: Deploy infrastructure with Pulumi
        run: |
          cd infra
          uv sync
          pulumi up --yes

      - name: Get deployment outputs
        id: pulumi-outputs
        run: |
          cd infra
          echo "runner_public_ip=$(pulumi stack output runner_public_ip)" >> $GITHUB_OUTPUT
          echo "flatris_app_public_ip=$(pulumi stack output flatris_app_public_ip)" >> $GITHUB_OUTPUT
          echo "flatris_app_private_ip=$(pulumi stack output flatris_app_private_ip)" >> $GITHUB_OUTPUT
          echo "flatris_url=$(pulumi stack output flatris_url)" >> $GITHUB_OUTPUT

      - name: Display infrastructure info
        run: |
          echo "==================================="
          echo "Infrastructure Deployed!"
          echo "==================================="
          echo "Runner IP: ${{ steps.pulumi-outputs.outputs.runner_public_ip }}"
          echo "Flatris App IP: ${{ steps.pulumi-outputs.outputs.flatris_app_public_ip }}"
          echo "Flatris URL: ${{ steps.pulumi-outputs.outputs.flatris_url }}"
          echo "==================================="